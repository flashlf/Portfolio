<main class="page-content">
	<div class="grid-container">
		<div class="grid-80 prefix-10">
		&nbsp;
		</div>

		<div class="grid-80 prefix-10" style="border-bottom: 1px solid rgba(0,0,0,.2);">
			<h1>Reach Me</h1><br>
		</div>

		<div class="grid-50 prefix-10">
			<br><form class="form" id="contact-form">
				<input type="email" name="email" placeholder="Email Address..." required><br>

				<div class="grid-50 grid-parent">
					<input type="text" name="Fname" placeholder="First Name" required>
				</div>
				<div class="grid-50 push-5 grid-parent">
					<input type="text" name="Lname" placeholder="Last Name" required>
				</div>

				<input type="text" name="subject" placeholder="Subject" style="width:100%;" required><br>
				<textarea name="message" required placeholder="Your message..."></textarea>
				<button type="submit">SEND</button>
			</form>
		</div>

		<div class="grid-30">
			<div class="social-panel">
				<ul class="social-links">
					<li>
						<a href="https://www.facebook.com/cmetamorph" target="_blank" rel="noreferrer" class="social-link">
							<span class="social-icon"><i class="fa-brands fa-facebook"></i></span>
							<span class="social-text">Facebook</span>
						</a>
					</li>
					<li>
						<a href="https://www.github.com/flashlf" target="_blank" rel="noreferrer" class="social-link">
							<span class="social-icon"><i class="fa-brands fa-git"></i></span>
							<span class="social-text">GitHub</span>
						</a>
					</li>
					<li>
						<a href="https://www.linkedin.com/in/muhammad-lumen" target="_blank" rel="noreferrer" class="social-link">
							<span class="social-icon"><i class="fa-brands fa-square-linkedin"></i></span>
							<span class="social-text">LinkedIn</span>
						</a>
					</li>
				</ul>
			</div>
		</div>

			<div class="contact-techstack">
				Made with
